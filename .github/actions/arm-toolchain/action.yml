name: Arm toolchain
description: Installs the compiler the firmware is developed and tested with (xPack Arm GCC 10.3.1) and puts it on PATH.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        XPACK_VERSION: 10.3.1-2.3
        XPACK_SHA256: 559dcf1c2dfddac513110fe23da0ef254032c09967eaa901f075515d51818719
      run: |
        archive=xpack-arm-none-eabi-gcc-${XPACK_VERSION}-linux-x64.tar.gz
        curl -fsSL -o "$archive" \
          "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${XPACK_VERSION}/${archive}"
        echo "${XPACK_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "$HOME/toolchain"
        tar -xzf "$archive" -C "$HOME/toolchain"
        echo "$HOME/toolchain/xpack-arm-none-eabi-gcc-${XPACK_VERSION}/bin" >> "$GITHUB_PATH"
