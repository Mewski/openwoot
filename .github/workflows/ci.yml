name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPENWOOT_NIGHTLY: nightly-2026-11-22

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: rustup toolchain install
      - run: rustup toolchain install "$OPENWOOT_NIGHTLY" --profile minimal --component rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0,cargo-sort@2.1.5
      - run: cargo fetch --locked
      - run: cargo xtask check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: rustup toolchain install
      - run: cargo test --workspace --locked

  pac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: rustup toolchain install "$OPENWOOT_NIGHTLY" --profile minimal --component rustfmt
      - run: cargo install --locked svd2rust@0.37.1 form@0.13.0
      - run: cargo xtask pac
      - run: git diff --exit-code

  boards:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - id: list
        run: |
          boards=$(cargo xtask boards --json)
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

  firmware:
    needs: [boards, check, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo xtask build ${{ matrix.board }}
      - run: cargo xtask flash ${{ matrix.board }} --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: openwoot-${{ matrix.board }}
          path: build/${{ matrix.board }}/
