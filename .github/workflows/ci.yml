name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo,cargo-sort
      - run: cargo xtask check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo test --workspace

  boards:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - id: list
        run: echo "boards=$(cargo xtask boards --json)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: boards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo xtask build ${{ matrix.board }}
      - run: cargo xtask flash ${{ matrix.board }} --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: openwoot-${{ matrix.board }}
          path: build/${{ matrix.board }}/
