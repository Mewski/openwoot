[package]
name = "openwoot-gd32f3"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[package.metadata.openwoot]
target = "thumbv7em-none-eabihf"

[dependencies]
cortex-m = { workspace = true }
critical-section = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
embassy-usb-driver = { workspace = true }
embedded-hal = { workspace = true }
gd32f303-pac = { workspace = true, features = ["critical-section"] }
openwoot-image = { workspace = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m-rt = { workspace = true, features = ["set-vtor"] }
critical-section = { workspace = true, features = ["restore-state-u8"] }
embassy-executor = { workspace = true, features = [
    "executor-interrupt",
    "executor-thread",
    "platform-cortex-m",
] }
embassy-time-driver = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { workspace = true }
gd32f303-pac = { workspace = true, features = ["critical-section", "rt"] }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[lints]
workspace = true
