// Protobuf schema (106 messages) of the settings files the keyboard stores in its littlefs
// file system and of the messages it exchanges with the host. Compatible with stock firmware 2.14.1.
// Nameless<nn> (numbered in file order), Nameless<nn>Enum, f<tag> and o<tag> are names chosen by this
// project where the firmware gives no hint of the meaning; the stored format only depends on the
// field numbers.

syntax = "proto2";

// Type of ProfileConfig.scan_mode. profile_apply_cfg clamps the value to 1 and writes it to g_run_state_flags bits 7:5 / g_adc_scan_mode_requested: 0 = one ADC input per trigger (adc_scan_process_single_sample), 1 = six inputs per trigger (adc_scan_process_parallel_samples). An enum (not uint8) so that the encoded cfg file fits its 26-byte buffer.
enum ScanMode {
  SCAN_MODE_SINGLE = 0;
  SCAN_MODE_PARALLEL = 1;
}

// Type of ProfileConfig.tap_duration. keys_process_scan_pass indexes the byte table {1, 20, 40} with it to get the tap length in ms (values above 2 give 40). An enum so that the encoded cfg file fits its 26-byte buffer.
enum TapDuration {
  TAP_DURATION_1MS = 0;
  TAP_DURATION_20MS = 1;
  TAP_DURATION_40MS = 2;
}

// Type of DeviceSettings.usb_gamepad_mode = g_usb_link_flags bits 1:0 (idProduct = 0x1400 + mode): 0 = interface 0 is the XInput interface, 1 = HID gamepad, 2 = 8-byte placeholder interface; 3 is rewritten to 2 at start-up. An enum so that the encoded ds file fits its 8-byte buffer.
enum UsbGamepadMode {
  USB_GAMEPAD_MODE_XINPUT = 0;
  USB_GAMEPAD_MODE_HID = 1;
  USB_GAMEPAD_MODE_NONE = 2;
}

// Type of DeviceSettings.gamepad_poll_interval = g_usb_gamepad_poll_rate bits 1:0: bInterval of the interface-0 endpoints chosen by tud_descriptor_configuration_cb: 0 = 4 ms, 1 = 1 ms, 2 = 125 us on a high-speed link (1 ms on full speed); 3 is stored as 1. An enum so that the encoded ds file fits its 8-byte buffer.
enum GamepadPollInterval {
  GAMEPAD_POLL_INTERVAL_4MS = 0;
  GAMEPAD_POLL_INTERVAL_1MS = 1;
  GAMEPAD_POLL_INTERVAL_125US = 2;
}

// Type of DeviceInfo.physical_layout. The start-up code copies values <= 2 to g_layout_physical_variant and selects the layout tables: 1 k_*_iso, 2 k_*_jis, else k_*_ansi.
enum PhysicalLayout {
  PHYSICAL_LAYOUT_ANSI = 0;
  PHYSICAL_LAYOUT_ISO = 1;
  PHYSICAL_LAYOUT_JIS = 2;
}

// Enum of Nameless02.f1 (name chosen by this project; the stored format only depends on the field numbers). The field must be an enum with values below 128: al<k> files are written through a 1332-byte buffer and a uint8 field would need 1333 bytes. The firmware does not read the field, so the value set is not known; only the zero value is declared.
enum Nameless02Enum {
  NAMELESS02_ENUM_0 = 0;
}

// Type of GamepadStickOptions.normalization. hid_gamepad_shape_stick: value 1 divides the stick vector by max(|x|, |y|), every other value (or an absent field) by sqrt(x*x + y*y). An enum so that the encoded gp file fits its 45-byte buffer.
enum StickNormalization {
  STICK_NORMALIZATION_CIRCULAR = 0;
  STICK_NORMALIZATION_SQUARE = 1;
}

// Hall switch type id = index into the 49-entry per-type tables such as k_analog_switch_travel (analog_build_switch_params; protocol_cmd_get_switch_types lists ids 0..48). The firmware holds no switch names. 0 is the factory default type; a special edition can have another default (profile_edition_default_switch_type, protocol_cmd_get_switch_profiles). An enum so that the encoded sw file fits its 1240-byte buffer.
enum SwitchType {
  SWITCH_TYPE_0 = 0;
  SWITCH_TYPE_1 = 1;
  SWITCH_TYPE_2 = 2;
  SWITCH_TYPE_3 = 3;
  SWITCH_TYPE_4 = 4;
  SWITCH_TYPE_5 = 5;
  SWITCH_TYPE_6 = 6;
  SWITCH_TYPE_7 = 7;
  SWITCH_TYPE_8 = 8;
  SWITCH_TYPE_9 = 9;
  SWITCH_TYPE_10 = 10;
  SWITCH_TYPE_11 = 11;
  SWITCH_TYPE_12 = 12;
  SWITCH_TYPE_13 = 13;
  SWITCH_TYPE_14 = 14;
  SWITCH_TYPE_15 = 15;
  SWITCH_TYPE_16 = 16;
  SWITCH_TYPE_17 = 17;
  SWITCH_TYPE_18 = 18;
  SWITCH_TYPE_19 = 19;
  SWITCH_TYPE_20 = 20;
  SWITCH_TYPE_21 = 21;
  SWITCH_TYPE_22 = 22;
  SWITCH_TYPE_23 = 23;
  SWITCH_TYPE_24 = 24;
  SWITCH_TYPE_25 = 25;
  SWITCH_TYPE_26 = 26;
  SWITCH_TYPE_27 = 27;
  SWITCH_TYPE_28 = 28;
  SWITCH_TYPE_29 = 29;
  SWITCH_TYPE_30 = 30;
  SWITCH_TYPE_31 = 31;
  SWITCH_TYPE_32 = 32;
  SWITCH_TYPE_33 = 33;
  SWITCH_TYPE_34 = 34;
  SWITCH_TYPE_35 = 35;
  SWITCH_TYPE_36 = 36;
  SWITCH_TYPE_37 = 37;
  SWITCH_TYPE_38 = 38;
  SWITCH_TYPE_39 = 39;
  SWITCH_TYPE_40 = 40;
  SWITCH_TYPE_41 = 41;
  SWITCH_TYPE_42 = 42;
  SWITCH_TYPE_43 = 43;
  SWITCH_TYPE_44 = 44;
  SWITCH_TYPE_45 = 45;
  SWITCH_TYPE_46 = 46;
  SWITCH_TYPE_47 = 47;
  SWITCH_TYPE_48 = 48;
}

// How the members of a light-bar condition (groups) or condition group (terms) combine: 0 = exactly one member expected (false otherwise), 1 = AND (true when empty), 2 = OR (false when empty), other = false. Evaluated by rgb_lightbar_eval_condition_group for terms and by rgb_render_lightbar_effect for groups. An enum so that the encoded lb / glb files fit their 838 / 828-byte buffers.
enum LightbarLogicOp {
  LIGHTBAR_LOGIC_OP_SINGLE = 0;
  LIGHTBAR_LOGIC_OP_AND = 1;
  LIGHTBAR_LOGIC_OP_OR = 2;
}

// Type of LightbarCompare.comparator: signal value against operand, evaluated by rgb_lightbar_eval_condition: 0 ==, 1 !=, 2 >, 3 >=, 4 <, 5 <=; other values make the term false. An enum so that the encoded lb / glb files fit their buffers.
enum LightbarComparator {
  LIGHTBAR_COMPARATOR_EQUAL = 0;
  LIGHTBAR_COMPARATOR_NOT_EQUAL = 1;
  LIGHTBAR_COMPARATOR_GREATER = 2;
  LIGHTBAR_COMPARATOR_GREATER_OR_EQUAL = 3;
  LIGHTBAR_COMPARATOR_LESS = 4;
  LIGHTBAR_COMPARATOR_LESS_OR_EQUAL = 5;
}

// Type of LightbarProfileIndicator.background_mode, evaluated by rgb_lightbar_resolve_profile_color: 0 background = profile colour, 1 no background, 2 background_color, 3 contrast colour picked from a fixed palette by the hue of the profile colour, 4 profile colour with R, G, B halved.
enum LightbarProfileBackground {
  LIGHTBAR_PROFILE_BACKGROUND_PROFILE_COLOR = 0;
  LIGHTBAR_PROFILE_BACKGROUND_NONE = 1;
  LIGHTBAR_PROFILE_BACKGROUND_FIXED_COLOR = 2;
  LIGHTBAR_PROFILE_BACKGROUND_CONTRAST_COLOR = 3;
  LIGHTBAR_PROFILE_BACKGROUND_DIMMED_PROFILE_COLOR = 4;
}

// Type of LightbarBlink.waveform, evaluated by rgb_render_lightbar_effect: 0 = colour b for 0.25 <= t < 0.75 of the period, 1 = blend weight 2 * min(t, 1 - t), other values = colour a only.
enum LightbarBlinkWaveform {
  LIGHTBAR_BLINK_WAVEFORM_SQUARE = 0;
  LIGHTBAR_BLINK_WAVEFORM_TRIANGLE = 1;
}

// Type of RgbLegacyEffect.effect: rgb_settings_convert_legacy_effect turns ids 1..11 into one effect layer whose oneof tag (= the kind rgb_render_effect_layers switches on) is the same number; 0 = no effect, ids above 11 give an empty layer.
enum RgbEffectKind {
  RGB_EFFECT_KIND_NONE = 0;
  RGB_EFFECT_KIND_RAINBOW_WAVE = 1;
  RGB_EFFECT_KIND_SCANNER = 2;
  RGB_EFFECT_KIND_BREATHING = 3;
  RGB_EFFECT_KIND_HUE_CYCLE = 4;
  RGB_EFFECT_KIND_KEY_RIPPLE = 5;
  RGB_EFFECT_KIND_REACTIVE_FADE = 6;
  RGB_EFFECT_KIND_LEVEL_METER = 7;
  RGB_EFFECT_KIND_ANALOG_SPOTLIGHT = 8;
  RGB_EFFECT_KIND_ANALOG_GLOW = 9;
  RGB_EFFECT_KIND_ANALOG_RGB_FILL = 10;
  RGB_EFFECT_KIND_KEY_TEST = 11;
}

// Type of RgbLegacyEffect.speed: rgb_settings_convert_legacy_effect translates 0 / 1 / 2 per effect into the layer timing parameter (rainbow wave period 40 / 16 / 8, scanner steps per second 11 / 15 / 31, breathing step 30 / 15 / 12 ms, hue cycle period 62 / 48 / 32, reactive fade step 8 / 4 / 2 ms; other values give 0), i.e. 0 is the slowest and 2 the fastest setting.
enum RgbLegacySpeed {
  RGB_LEGACY_SPEED_SLOW = 0;
  RGB_LEGACY_SPEED_MEDIUM = 1;
  RGB_LEGACY_SPEED_FAST = 2;
}

// Hue range of the rainbow wave and hue cycle effects: rgb_effect_reset_slot_state (and rgb_effects_apply_layer_settings) writes the first / last hue (0..255) of the range into the layer state; 0 = full circle 0..255 run as a sawtooth, 1..5 = the named range run back and forth (the renderers test only zero / non-zero, so any other value runs 0..255 back and forth).
enum RgbHuePreset {
  RGB_HUE_PRESET_FULL_CIRCLE = 0;
  RGB_HUE_PRESET_110_TO_184 = 1;
  RGB_HUE_PRESET_2_TO_39 = 2;
  RGB_HUE_PRESET_64_TO_114 = 3;
  RGB_HUE_PRESET_214_TO_254 = 4;
  RGB_HUE_PRESET_113_TO_204 = 5;
}

// Type of RgbEffectScanner.start_direction = initial phase of rgb_effect_render_scanner (copied to the layer state by rgb_effect_reset_slot_state): 0 window moves towards lower columns, 1 towards higher columns (0 and 1 alternate), 2 towards lower rows, 3 towards higher rows (2 and 3 alternate).
enum RgbScannerDirection {
  RGB_SCANNER_DIRECTION_LEFT = 0;
  RGB_SCANNER_DIRECTION_RIGHT = 1;
  RGB_SCANNER_DIRECTION_UP = 2;
  RGB_SCANNER_DIRECTION_DOWN = 3;
}

// Which key of a two-key advanced key stays pressed while both are held (keys_process_scan_pass): 0 both, 2 the key that owns the entry, 3 the second key, 4 the key pressed last, 1 and every other value neither.
enum TwoKeyResolution {
  TWO_KEY_RESOLUTION_BOTH = 0;
  TWO_KEY_RESOLUTION_NEITHER = 1;
  TWO_KEY_RESOLUTION_FIRST_KEY = 2;
  TWO_KEY_RESOLUTION_SECOND_KEY = 3;
  TWO_KEY_RESOLUTION_LAST_PRESSED = 4;
}

// Type of ModTap.interrupt_mode: what another key press does to an undecided mod-tap key (keys_process_scan_pass): 1 nothing, 2 decide for the hold key code, 3 decide for the tap key code, 0 / other / field absent = hold, but only if the hold key code is a modifier (99..106) or a momentary layer key (231, 234, 235).
enum ModTapInterruptMode {
  MOD_TAP_INTERRUPT_MODE_AUTO = 0;
  MOD_TAP_INTERRUPT_MODE_IGNORE = 1;
  MOD_TAP_INTERRUPT_MODE_HOLD = 2;
  MOD_TAP_INTERRUPT_MODE_TAP = 3;
}

// C struct: 18 bytes; top-level.
// Content of littlefs file <profile>/cfg: wrapper around ProfileConfig. Read by protocol_cmd_get_profile_cfg (feature command 39) and profile_load_and_apply_cfg, written by protocol_cmd_set_profile_cfg (OUT-report command 17), protocol_cmd_save_live_cfg and profile_create_factory_defaults through a 26-byte buffer.
message ProfileConfigFile {
  required ProfileConfig config = 1;  // @0x0 ProfileConfig, 18 bytes. the 18-byte struct handled by profile_apply_cfg / profile_export_cfg
}

// C struct: 132 bytes; top-level.
// Content of littlefs file <profile>/rgb, RAM copy g_rgb_settings (132 bytes). Sent by protocol_cmd_get_rgb_settings (feature command 0x32), received by protocol_cmd_set_rgb_settings (OUT-report command 22); written through a 182-byte buffer.
message RgbSettings {
  required RgbBaseSettings base = 1;    // @0x0 RgbBaseSettings, 28 bytes. brightness and indicator colours
  oneof effect {                        // uint16 which at +0x1C: 3 = legacy single effect, 4 = layer list
    RgbLegacyEffect legacy_effect = 3;  // @0x20 RgbLegacyEffect, 8 bytes, which_ @0x1C. which_effect == 3: single effect in the old format; rgb_settings_convert_legacy_effect rewrites it in place into a one-entry layer list (tag 4)
    RgbEffectLayerList layers = 4;      // @0x20 RgbEffectLayerList, 100 bytes, which_ @0x1C. which_effect == 4: effect layer list copied into the runtime layers by rgb_effects_apply_layer_settings
  }
}

// C struct: 51 bytes; top-level.
// Content of littlefs file global, RAM copy g_profile_global_settings (51 bytes): keyboard-wide settings. Sent by protocol_cmd_get_global_settings (feature command 51), received by protocol_cmd_set_global_settings (OUT-report command 23); written through a 56-byte buffer by protocol_cmd_set_global_settings and profile_create_factory_defaults.
message GlobalSettings {
  optional IdleSettings idle = 1;                                      // @0x1 IdleSettings, 4 bytes, has_ @0x0. rgb_update_frame runs the LED idle timer only when this member is present
  optional bool num_lock_indicator_inverted = 2 [default = false];     // @0x6 bool, has_ @0x5. rgb_update_lock_indicators and tud_hid_set_report_cb: the Num Lock indicator is lit while Num Lock is off when the field is absent or true
  optional bool release_rebound_filter_enabled = 3 [default = false];  // @0x8 bool, has_ @0x7. has && value is latched in g_profile_global_option3_active (at start-up and by protocol_cmd_set_global_settings); while set both scan paths run analog_detect_release_rebound for every key
  optional string f4 = 4;                                              // @0xA char[41], has_ @0x9. string of up to 40 characters; stored and returned only, the firmware does not read it
}

// C struct: 126 bytes; top-level, used by ActuationPoints, KeyByteMap.
// 6 rows x 21 uint8 per-key matrix, reply of protocol_cmd_get_key_sensor_values; also member 1 of the oneofs of ActuationPoints and KeyByteMap.
message KeyMatrixU8 {
  repeated KeyMatrixU8Row rows = 1;  // @0x0 KeyMatrixU8Row, 21 bytes x 6. fixed array of 6 x 21 bytes: one row of the 6 x 21 key matrix each
}

// C struct: 4 bytes; top-level.
// Reply of protocol_cmd_get_storage_usage.
message StorageUsage {
  required int32 blocks_in_use = 1;  // @0x0 int32_t. littlefs blocks in use, or a negative lfs error
}

// C struct: 16 bytes; top-level.
// Reply of protocol_cmd_get_active_profile_state.
message ActiveProfileState {
  required uint32 profile_index = 1;      // @0x0 uint32_t. profile index
  optional bool sdk_mode_active = 2;      // @0x5 bool, has_ @0x4. SDK / direct LED mode active
  optional bool leds_off_by_idle = 3;     // @0x7 bool, has_ @0x6. LEDs switched off by the idle timer
  optional uint32 profile_namespace = 4;  // @0xC uint32_t, has_ @0x8. profile namespace (0 = <n>/, 1 = lp/<n>/)
}

// C struct: 57 bytes; top-level.
// Content of littlefs file <profile>/i: profile name and colour. Sent by protocol_cmd_get_profile_info (feature command 55), received by protocol_cmd_set_profile_info (OUT-report command 26); written through a 65-byte buffer by protocol_cmd_set_profile_info and profile_create_factory_defaults.
message ProfileInfo {
  required string name = 1;     // @0x0 char[31]. profile_create_factory_defaults stores the board's factory profile names here (boards/<board>/defaults)
  optional RgbColor color = 2;  // @0x20 RgbColor, 3 bytes, has_ @0x1F. protocol_cmd_set_profile_info packs the three bytes as 0xFF000000 | r << 16 | g << 8 | b and publishes them as RGB signal 10, the profile colour
  optional string f3 = 3;       // @0x24 char[21], has_ @0x23. string of up to 20 characters, never interpreted by the firmware. profile_create_factory_defaults stores an icon id of the host program here, such as "woot:p:black" or "switchy:laser"
}

// C struct: 828 bytes; top-level.
// Content of littlefs file <profile>/lb, RAM copy g_rgb_lightbar_config (828 bytes): effects of the 10-LED light bar of one profile. Sent by protocol_cmd_get_lightbar_config (feature command 0x42), received by protocol_cmd_set_lightbar_config (OUT-report command 32); written through an 838-byte buffer by protocol_cmd_set_lightbar_config and profile_create_factory_defaults.
message LightbarConfig {
  required bool enabled = 1 [default = true];      // @0x0 bool. g_rgb_lightbar_config[0]: gate of rgb_render_lightbar in rgb_update_frame; false = brightness 0 and nothing bound
  repeated LightbarEntry entries = 2;              // @0x4 LightbarEntry, 204 bytes x 4, count @0x2. up to 4 entries drawn in order by rgb_render_lightbar, bound by rgb_lightbar_rebind_signals
  required bool use_global = 3 [default = true];   // @0x334 bool. g_rgb_lightbar_use_global: also bind and draw the entries of the glb file, before the profile entries
  optional uint32 brightness = 4 [default = 255];  // @0x338 uint32_t, has_ @0x335. light-bar brightness 0..255; when absent the key brightness RgbBaseSettings.brightness is used
}

// C struct: 256 bytes; top-level.
// Content of littlefs file <profile>/act: per-key actuation points in one of four encodings, applied by keys_apply_actuation_map, sanitised by keys_sanitize_actuation_map. Sent by protocol_cmd_get_actuation_points (feature command 49), received by protocol_cmd_set_actuation_points (OUT-report command 21); written through a 519-byte buffer by protocol_cmd_set_actuation_points and profile_create_factory_defaults.
message ActuationPoints {
  oneof map {                      // uint16 which at +0, switched on by keys_apply_actuation_map and keys_sanitize_actuation_map
    KeyMatrixU8 matrix_u8 = 1;     // @0x4 KeyMatrixU8, 126 bytes, which_ @0x0. which == 1: 6 x 21 legacy 8-bit values (v/255 of the full travel), 0 = no per-key override
    KeyValueListU8 list_u8 = 2;    // @0x4 KeyValueListU8, 102 bytes, which_ @0x0. which == 2: up to 50 items key id | 8-bit value << 8; used by the factory defaults
    KeyMatrixU16 matrix_u16 = 3;   // @0x4 KeyMatrixU16, 252 bytes, which_ @0x0. which == 3: 6 x 21 values in the distance encoding; built by protocol_cmd_get_actuation_points when more than 50 keys have an override
    KeyValueListU16 list_u16 = 4;  // @0x4 KeyValueListU16, 204 bytes, which_ @0x0. which == 4: up to 50 items key id | value << 16 in the distance encoding; built by protocol_cmd_get_actuation_points otherwise
  }
}

// C struct: 128 bytes; top-level, used by GamepadMapping.
// One byte per key as a dense matrix or a sparse list. Content of littlefs file <profile>/prt (legacy per-key rapid-trigger mode: 0 no override, 1 override off, 2 override on, keys_apply_legacy_rapid_trigger_keys), sent by protocol_cmd_get_legacy_rapid_trigger_keys (feature command 0x36), received by protocol_cmd_set_legacy_rapid_trigger_keys (OUT-report command 25) and written through a 203-byte buffer; also the per-key gamepad bindings of GamepadMapping (keys_apply_gamepad_map).
message KeyByteMap {
  oneof map {                 // uint16 which at +0: 1 dense, 2 sparse
    KeyMatrixU8 matrix = 1;   // @0x2 KeyMatrixU8, 126 bytes, which_ @0x0. which == 1: 6 x 21 bytes by key matrix position
    KeyValueListU8 list = 2;  // @0x2 KeyValueListU8, 102 bytes, which_ @0x0. which == 2: up to 50 items key id | value << 8
  }
}

// C struct: 662 bytes; top-level.
// Content of littlefs file <profile>/prt2, RAM copy g_keys_rt_groups (662 bytes): per-key rapid-trigger settings as groups of keys, applied by keys_apply_rapid_trigger_groups. Sent by protocol_cmd_get_rapid_trigger_groups (feature command 61), received by protocol_cmd_set_rapid_trigger_groups (OUT-report command 29) and written through a 1320-byte buffer.
message RapidTriggerGroups {
  repeated RapidTriggerGroup groups = 1;  // @0x2 RapidTriggerGroup, 22 bytes x 30, count @0x0. up to 30 groups of 22 bytes
}

// C struct: 642 bytes; top-level.
// Content of littlefs file <profile>/ak2, RAM copy g_keys_advanced_keys (642 bytes): list of advanced-key bindings. Read by profile_activate and protocol_cmd_get_advanced_keys, written through a 1040-byte buffer by protocol_cmd_save_advanced_keys (feature command 0x35) and storage_save_advanced_keys.
message AdvancedKeys {
  repeated AdvancedKey entries = 1;  // @0x2 AdvancedKey, 16 bytes x 40, count @0x0. up to 40 entries of 16 bytes; the index is stored in the key records by keys_bind_advanced_key
}

// C struct: 15 bytes; top-level.
// Content of littlefs file <profile>/gp, RAM copy g_hid_gamepad_settings (15 bytes): analog stick response of the gamepad function. Sent by protocol_cmd_get_gamepad_settings (feature command 0x29), received by protocol_cmd_set_gamepad_settings (OUT-report command 19) and written through a 45-byte buffer.
message GamepadSettings {
  required GamepadResponseCurve response_curve = 1;  // @0x0 GamepadResponseCurve, 8 bytes. g_hid_gamepad_settings +0..+7, used by hid_gamepad_normalize_travel and hid_gamepad_apply_response_curve
  required GamepadStickOptions stick_options = 2;    // @0x8 GamepadStickOptions, 7 bytes. g_hid_gamepad_settings +8..+0xE, used by hid_gamepad_shape_stick and hid_gamepad_combine_axis
}

// C struct: 130 bytes; top-level.
// Content of littlefs file <profile>/gm (130 bytes): gamepad control bound to each key, applied by keys_apply_gamepad_map. Sent by protocol_cmd_get_gamepad_mapping (feature command 40), received by protocol_cmd_set_gamepad_mapping (OUT-report command 18) and written through a 208-byte buffer.
message GamepadMapping {
  required KeyByteMap bindings = 1;                            // @0x0 KeyByteMap, 128 bytes. gamepad control id per key, 0 = none, stored in key record +0x92 by keys_apply_gamepad_map
  required bool gamepad_keys_exclusive = 2 [default = false];  // @0x80 bool. g_hid_gamepad_keys_exclusive: true = a key with a gamepad binding does not send its layer-0 key code while a gamepad USB mode is active
}

// C struct: 1324 bytes; top-level.
// Content of littlefs file lp/<n>/al<k>. max_encoded_size 1332 is the size of the encode buffer. Sent by protocol_cmd_get_profile_al_file (feature command 87), received by protocol_cmd_set_al_file (OUT-report command 44). The firmware only moves the message between host and file and does not interpret its fields; their names are chosen by this project, the stored format only depends on the field numbers.
message AlFile {
  optional string f1 = 1;  // @0x1 char[261], has_ @0x0
  oneof o2 {
    Nameless02 f2 = 2;     // @0x108 Nameless02, 1060 bytes, which_ @0x106
    uint32 f3 = 3;         // @0x108 uint32_t, which_ @0x106
  }
}

// C struct: 48 bytes; top-level.
// Device-info record stored raw in the last SPI flash sector 0x7FF000 by storage_write_device_info / read by storage_read_device_info.
message DeviceInfo {
  required SerialNumber serial_number = 1;      // @0x0 SerialNumber, 20 bytes. struct converted to the USB serial string by storage_format_serial_string; first uint16 == 0xFFFF means not programmed
  optional DeviceInfoAux f2 = 2;                // @0x16 DeviceInfoAux, 22 bytes, has_ @0x14. optional record of two 10-byte entries, stored and returned only; the firmware does not read its content
  optional PhysicalLayout physical_layout = 3;  // @0x2D PhysicalLayout (1 byte), has_ @0x2C. struct +0x2C has-flag, +0x2D value: byte 5 of the device-settings block (storage_load_device_settings, storage_save_device_settings), copied to g_layout_physical_variant at start-up; see enum PhysicalLayout
  optional uint32 lock_mode = 4;                // @0x2F uint8_t, has_ @0x2E. struct +0x2E has-flag, +0x2F value: g_profile_lock_mode, written only as 1 or 3 by protocol_cmd_set_lock_mode; (value & 0xFD) == 1 makes the switch profile read-only and disables host signals
}

// C struct: 820 bytes; top-level.
// Content of littlefs file glb, RAM copy g_rgb_global_lightbar_config (820 bytes): light-bar entries shared by all profiles. Sent by protocol_cmd_get_global_lightbar_config (feature command 67), received by protocol_cmd_set_global_lightbar_config (OUT-report command 33); written through an 828-byte buffer by protocol_cmd_set_global_lightbar_config and profile_create_factory_defaults.
message GlobalLightbarConfig {
  repeated LightbarEntry entries = 1;  // @0x4 LightbarEntry, 204 bytes x 4, count @0x0. up to 4 entries, bound and drawn before the profile entries when LightbarConfig.use_global is set
}

// C struct: 22 bytes; top-level, used by DeviceInfo.
// DeviceInfo field 2; also sent on its own by protocol_cmd_get_device_info_aux_record (feature command 59) and received by protocol_cmd_set_device_info_aux_record (OUT-report command 28). The firmware stores and returns it without reading the content, so "aux" says nothing about the meaning; the field names are chosen by this project.
message DeviceInfoAux {
  required Nameless06 f1 = 1;  // @0x0 Nameless06, 10 bytes
  optional Nameless06 f2 = 2;  // @0xC Nameless06, 10 bytes, has_ @0xA
}

// C struct: 20 bytes; top-level, used by DeviceInfo.
// DeviceInfo field 1, formatted into the USB serial string "A<nn>B<nn><nn>W<nn>[T<nn>]<n>[<nn>][S<nn>]<stage><nnnnn>" by storage_format_serial_string; also sent by protocol_cmd_get_serial (feature command 3, selector 2) and received by protocol_cmd_set_serial_number (OUT-report command 12). The firmware only prints most of the numbers; the names f<tag> of those fields are chosen by this project, the stored format only depends on the field numbers.
message SerialNumber {
  required uint32 f1 = 1;       // @0x0 uint16_t. printed as "A%02u" (low byte) by storage_format_serial_string; 0xFFFF = serial not programmed
  required uint32 f2 = 2;       // @0x2 uint8_t. printed as the first "%02u" after "B"
  required uint32 f3 = 3;       // @0x3 uint8_t. printed as the second "%02u" after "B"
  required uint32 f4 = 4;       // @0x4 uint16_t. printed as "W%02u" (low byte)
  required uint32 f5 = 5;       // @0x6 uint16_t. printed as "%01u" (low byte) after the W / T fields
  required uint32 f6 = 6;       // @0x8 uint32_t. printed last as "%05lu"; clamped to 0xFFFE in the reply of protocol_cmd_get_serial
  required uint32 stage = 7;    // @0xC uint8_t. struct +0xC: selects the stage letter of the serial string from k_storage_serial_stage_chars: 1 P, 2 T, 3 E, 4 X, every other value H
  optional uint32 edition = 9;  // @0xE uint8_t, has_ @0xD. struct +0xD has-flag, +0xE value: edition code of the unit; a board lists the codes of its special editions (profile_edition_is_special); 1 = factory switch profile without a switch type (protocol_cmd_get_switch_profiles); printed as "S%02u" before the stage letter
  optional uint32 f10 = 10;     // @0x10 uint8_t, has_ @0xF. optional, printed as "T%02u" after the W field
  optional uint32 f11 = 11;     // @0x12 uint8_t, has_ @0x11. optional, printed as "%02u" after the "%01u" field
}

// C struct: 8 bytes; submessage, used by RapidTriggerGroup.
// Rapid-trigger parameters of a RapidTriggerGroup (8 bytes, same layout as g_keys_rapid_trigger_params), used by keys_update_press_state through key record +0x94; sanitised by keys_sanitize_rapid_trigger_groups.
message RapidTriggerParams {
  required uint32 sensitivity = 1 [default = 65];  // @0x0 uint16_t. params +0: press sensitivity, and release sensitivity when none is set; default 65; distance encoding of keys_sanitize_distance / keys_get_actuation_threshold: 1..255 = v/255 of the full switch travel, 0x4000 | n = n/0x3FFF of the full travel, 0 = not set
  optional uint32 release_sensitivity = 2;         // @0x4 uint16_t, has_ @0x2. params +2 has-flag, +4 value: separate release sensitivity; distance encoding as sensitivity
  optional bool continuous = 3 [default = false];  // @0x7 bool, has_ @0x6. params +7: true = rapid trigger stays engaged until the travel is 0 instead of leaving below actuation point - 96
}

// C struct: 3 bytes; submessage, used by AdvancedKey.
// AdvancedKey type 5 (entry +2, 3 bytes): the entry key and a second key; while both are pressed a fixed rule decides which one is reported (keys_process_scan_pass).
message TwoKeySocd {
  required uint32 second_key_id = 1;                               // @0x0 uint8_t. entry +2: key id = row << 5 | col of the 6 x 17 key matrix of the second key, which gets the same binding
  required TwoKeyResolution resolution = 2;                        // @0x1 TwoKeyResolution (1 byte). entry +3: rule applied while both keys are pressed, see enum TwoKeyResolution
  required bool both_on_when_fully_pressed = 3 [default = false];  // @0x2 bool. entry +4: true = both keys are reported while both are fully pressed (travel > 4013)
}

// C struct: 2 bytes; submessage, used by AdvancedKey.
// AdvancedKey type 4 (entry +2, 2 bytes): the entry key and a second key; while both are pressed the deeper one wins, at about equal depth the previous decision is kept (keys_process_scan_pass).
message TwoKeyDepthPriority {
  required uint32 second_key_id = 1;                       // @0x0 uint8_t. entry +2: key id = row << 5 | col of the 6 x 17 key matrix of the second key, which gets the same binding
  required TwoKeyResolution both_bottomed_resolution = 2;  // @0x1 TwoKeyResolution (1 byte). entry +3: rule applied when both keys are bottomed out (travel > 4013), see enum TwoKeyResolution
}

// C struct: 1 byte; submessage, used by AdvancedKey.
// AdvancedKey type 3 (entry +2, 1 byte): a short press latches the key code on, the next one releases it (keys_process_scan_pass).
message ToggleKey {
  required uint32 keycode = 1;  // @0x0 uint8_t. entry +2: key code that is latched
}

// C struct: 6 bytes; submessage, used by AdvancedKey.
// AdvancedKey type 2 (entry +2, 6 bytes): one key code when tapped, another when held (keys_process_scan_pass).
message ModTap {
  required uint32 tap_keycode = 1;                  // @0x0 uint8_t. entry +2: key code sent for a tap
  required uint32 hold_keycode = 2;                 // @0x1 uint8_t. entry +3: key code held after the hold time
  optional uint32 hold_time_10ms = 3;               // @0x3 uint8_t, has_ @0x2. entry +4 has-flag, +5 value: hold time = 10 * value ms, 200 ms when absent
  optional ModTapInterruptMode interrupt_mode = 4;  // @0x5 ModTapInterruptMode (1 byte), has_ @0x4. entry +6 has-flag, +7 value: see enum ModTapInterruptMode
}

// C struct: 12 bytes; submessage, used by AdvancedKey.
// AdvancedKey type 1 (entry +2, 12 bytes): up to four key codes pressed / released / tapped at four points of the key travel; detected by keys_process_scan_pass, output by keys_process_advanced_keys.
message DynamicKeystroke {
  required bytes keycodes = 1;           // @0x0 uint8_t[4]. entry +2..+5: key codes of the four bindings
  required bytes event_masks = 2;        // @0x4 uint8_t[4]. entry +6..+9: one byte per travel event (actuation, bottom-out, leaving the bottom, release), 2 bits per binding: 0 none, 1 press, 2 release, 3 tap; passed to keys_dks_queue_events
  optional uint32 bottom_out_point = 3;  // @0xA uint16_t, has_ @0x8. entry +0xA has-flag, +0xC value: travel of the bottom-out event, 3693 / 4095 when absent; distance encoding of keys_sanitize_distance / keys_get_actuation_threshold: 1..255 = v/255 of the full switch travel, 0x4000 | n = n/0x3FFF of the full travel, 0 = not set
}

// C struct: 22 bytes; submessage, used by RapidTriggerGroups.
// One group of RapidTriggerGroups (22 bytes): a list of keys and their rapid-trigger override, applied by keys_apply_rapid_trigger_groups.
message RapidTriggerGroup {
  repeated uint32 key_ids = 1;      // @0x2 uint8_t x 10, count @0x0. group +0 count, +2 up to 10 key ids (key id = row << 5 | col of the 6 x 17 key matrix); every valid key gets the override
  oneof setting {                   // uint16 which at group +0xC: 2 = params, 3 = bool
    RapidTriggerParams params = 2;  // @0xE RapidTriggerParams, 8 bytes, which_ @0xC. which == 2: rapid trigger on with these parameters; the key records point at this struct (record +0x94)
    bool enabled = 3;               // @0xE bool, which_ @0xC. which == 3: override without parameters, rapid trigger on (true) or off (false) with the profile-wide parameters
  }
}

// C struct: 16 bytes; submessage, used by AdvancedKeys, AdvancedKeysPage.
// One advanced-key binding (16 bytes: uint16 which = type 1..5, union at +2, key id at +0xE, layer at +0xF), element of AdvancedKeys and AdvancedKeysPage; bound by keys_apply_advanced_key_entry, run by keys_process_scan_pass and keys_process_advanced_keys.
message AdvancedKey {
  oneof kind {                               // uint16 which at entry +0 = advanced-key type
    DynamicKeystroke dynamic_keystroke = 1;  // @0x2 DynamicKeystroke, 12 bytes, which_ @0x0. type 1: keys at four travel points
    ModTap mod_tap = 2;                      // @0x2 ModTap, 6 bytes, which_ @0x0. type 2: tap / hold
    ToggleKey toggle = 3;                    // @0x2 ToggleKey, 1 bytes, which_ @0x0. type 3: latching key
    TwoKeyDepthPriority depth_priority = 4;  // @0x2 TwoKeyDepthPriority, 2 bytes, which_ @0x0. type 4: two keys, the deeper one wins
    TwoKeySocd socd = 5;                     // @0x2 TwoKeySocd, 3 bytes, which_ @0x0. type 5: two opposing keys resolved by a fixed rule
  }
  required uint32 key_id = 8;                // @0xE uint8_t. entry +0xE: key id = row << 5 | col of the 6 x 17 key matrix of the key that owns the entry
  required uint32 layer = 9 [default = 0];   // @0xF uint8_t. entry +0xF: keymap layer 0..3 of the binding, selects the slot +0x85 + 2 * layer of the key record
}

// C struct: 264 bytes; submessage, used by Nameless02.
// Entry of Nameless02: oneof of four 260-character strings (tags 1..4). Never interpreted by the firmware. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless01 {
  oneof o1 {
    string f1 = 1;  // @0x2 char[261], which_ @0x0
    string f2 = 2;  // @0x2 char[261], which_ @0x0
    string f3 = 3;  // @0x2 char[261], which_ @0x0
    string f4 = 4;  // @0x2 char[261], which_ @0x0
  }
}

// C struct: 1060 bytes; submessage, used by AlFile.
// AlFile oneof tag 2: optional 1-byte enum and up to four entries of one 260-character string each. Never interpreted by the firmware. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless02 {
  optional Nameless02Enum f1 = 1;  // @0x1 Nameless02Enum (1 byte), has_ @0x0. an enum so that the encoded al file fits its 1332-byte buffer, see Nameless02Enum
  repeated Nameless01 f2 = 2;      // @0x4 Nameless01, 264 bytes x 4, count @0x2
}

// C struct: 4 bytes; submessage, used by Nameless05.
// Nameless05 oneof tag 1: four required uint8. Never read by the firmware. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless03 {
  required uint32 f1 = 1;  // @0x0 uint8_t
  required uint32 f2 = 2;  // @0x1 uint8_t
  required uint32 f3 = 3;  // @0x2 uint8_t
  required uint32 f4 = 4;  // @0x3 uint8_t
}

// C struct: 3 bytes; submessage, used by Nameless06.
// Nameless06 field 2: three required uint8. Never read by the firmware. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless04 {
  required uint32 f1 = 1;  // @0x0 uint8_t
  required uint32 f2 = 2;  // @0x1 uint8_t
  required uint32 f3 = 3;  // @0x2 uint8_t
}

// C struct: 6 bytes; submessage, used by Nameless06.
// Nameless06 field 1: oneof of four uint8 (tag 1) or one uint8 (tag 2). Never read by the firmware. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless05 {
  oneof o1 {
    Nameless03 f1 = 1;    // @0x2 Nameless03, 4 bytes, which_ @0x0
    uint32 f2 = 2;        // @0x2 uint8_t, which_ @0x0
  }
}

// C struct: 10 bytes; submessage, used by DeviceInfoAux.
// Entry type of DeviceInfoAux (10 bytes: 6-byte oneof message, then three uint8). Never read by the firmware. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless06 {
  required Nameless05 f1 = 1;  // @0x0 Nameless05, 6 bytes
  required Nameless04 f2 = 2;  // @0x6 Nameless04, 3 bytes
}

// C struct: 12 bytes; submessage, used by LightbarCompare.
// Right operand of a LightbarCompare (term +0x18, 12 bytes: uint16 which at +0, union at +4); read by rgb_lightbar_eval_condition, bound by rgb_lightbar_bind_compare_condition.
message LightbarOperand {
  oneof value {            // uint16 which at term +0x18, tested by rgb_lightbar_eval_condition
    SignalRef signal = 1;  // @0x4 SignalRef, 8 bytes, which_ @0x0. which == 1: another signal; its value is kept in the term state +8
    float constant = 2;    // @0x4 float, which_ @0x0. which == 2: constant (term +0x1C), compared as a float
  }
}

// C struct: 32 bytes; submessage, used by LightbarConditionTerm.
// LightbarConditionTerm tag 2 (term +4, 32 bytes): compares the signal value with an operand; evaluated by rgb_lightbar_eval_condition, bound by rgb_lightbar_bind_compare_condition.
message LightbarCompare {
  required SignalRef signal = 1;               // @0x0 SignalRef, 8 bytes. term +4: left operand
  optional uint32 hold_ms = 2;                 // @0xC uint32_t, has_ @0x8. term +0xC has-flag, +0x10 value: when present the term is true only while a timer of this many ms, started when the comparison turns true, is running
  required LightbarComparator comparator = 3;  // @0x10 LightbarComparator (1 byte). term +0x14: see enum LightbarComparator
  required LightbarOperand operand = 4;        // @0x14 LightbarOperand, 12 bytes. term +0x18: right operand
}

// C struct: 12 bytes; submessage, used by LightbarConditionTerm.
// LightbarConditionTerm tag 1 (term +4, 12 bytes): the term becomes true when its signal changes and stays true while the timer runs (rgb_lightbar_eval_condition).
message LightbarTrigger {
  required SignalRef signal = 1;    // @0x0 SignalRef, 8 bytes. term +4: signal whose change fires the trigger, subscribed by rgb_lightbar_bind_condition_group
  required uint32 duration_ms = 2;  // @0x8 uint32_t. term +0xC: loaded (truncated to 16 bit) into the hold timer when the signal changed; the timer is decremented by the frame time in ms
}

// C struct: 2 bytes; submessage, used by KeyRect.
// Key matrix position (2 bytes), corner of a KeyRect; rgb_render_lightbar_effect indexes g_rgb_key_to_led[17 * row + col] with it.
message KeyPosition {
  required uint32 row = 1;  // @0x0 uint8_t. row 0..5 (outer loop of the rectangle fill)
  required uint32 col = 2;  // @0x1 uint8_t. column 0..16 (inner loop of the rectangle fill)
}

// C struct: 36 bytes; submessage, used by LightbarConditionGroup.
// One term of a LightbarConditionGroup (36 bytes: uint16 which at +0, union at +4), evaluated by rgb_lightbar_eval_condition.
message LightbarConditionTerm {
  oneof kind {                    // uint16 which at term +0, tested by rgb_lightbar_eval_condition
    LightbarTrigger trigger = 1;  // @0x4 LightbarTrigger, 12 bytes, which_ @0x0. which == 1: true for a time after the signal changed
    LightbarCompare compare = 2;  // @0x4 LightbarCompare, 32 bytes, which_ @0x0. which == 2: comparison of the signal with an operand
  }
}

// C struct: 12 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 15 (RgbEffectLayer tag 15): two-colour angular gradient rotating around the keyboard centre, rendered in rgb_render_effect_layers with the tables from rgb_init_polar_tables.
message RgbEffectPolarGradient {
  required uint32 color_a = 1;  // @0x0 uint32_t. layer +4; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  required uint32 color_b = 2;  // @0x4 uint32_t. layer +8; packed colour as color_a
  required sint32 speed = 3;    // @0x8 int8_t. layer +0xC, signed: phase advances by elapsed_ms * speed per frame, one turn per 65535 / |speed| ms, sign = direction
  required sint32 twist = 4;    // @0x9 int8_t. layer +0xD, signed: phase offset per unit of distance from the centre = twist / 127 * 0.1 (spiral)
}

// C struct: 12 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 14 (RgbEffectLayer tag 14): two-colour 3D simplex noise field, rendered in rgb_render_effect_layers.
message RgbEffectSimplexNoise {
  required uint32 color_a = 1;  // @0x0 uint32_t. layer +4: colour at noise value 0; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  required uint32 color_b = 2;  // @0x4 uint32_t. layer +8: colour at noise value 255; packed colour as color_a
  required uint32 speed = 3;    // @0x8 uint8_t. layer +0xC: noise time advances by (elapsed_ms * speed) >> 5 per frame
  required uint32 scale = 4;    // @0x9 uint8_t. layer +0xD: noise-space step per key = scale << 4
}

// C struct: 1 byte; submessage, used by RgbEffectLayer.
// Empty parameter message of effect kind 13 (RgbEffectLayer tag 13). rgb_effects_feed_key_travel keeps a per-key analog level map for this kind (as for kinds 8 and 9), but rgb_render_effect_layers has no case for it. Name chosen by this project; the stored format only depends on the field numbers.
message Nameless07 {
}

// C struct: 12 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 12 (RgbEffectLayer tag 12). The firmware does not read them: rgb_render_effect_layers, rgb_effect_reset_slot_state and rgb_effects_apply_layer_settings have no case for kind 12. The message and field names are chosen by this project; the stored format only depends on the field numbers.
message Nameless08 {
  required uint32 f1 = 1;  // @0x0 uint8_t
  required uint32 f2 = 2;  // @0x1 uint8_t
  required uint32 f3 = 3;  // @0x2 uint8_t
  required uint32 f4 = 4;  // @0x3 uint8_t
  required uint32 f5 = 5;  // @0x4 uint8_t
  required uint32 f6 = 6;  // @0x5 uint8_t
  required uint32 f7 = 7;  // @0x8 uint32_t
}

// C struct: 1 byte; submessage, used by RgbEffectLayer.
// Parameters of effect kind 11 (RgbEffectLayer tag 11): keys marked red (1) or green (2) by rgb_effects_handle_key_event, rendered in rgb_render_effect_layers.
message RgbEffectKeyTest {
  required uint32 base_level = 1;  // @0x0 uint8_t. layer +4: scale of unmarked keys
}

// C struct: 1 byte; submessage, used by RgbEffectLayer.
// Parameters of effect kind 10 (RgbEffectLayer tag 10): all keys in one colour whose red, green and blue levels are the depths of the keys row 5 columns 14, 15, 16 (fed by rgb_effects_feed_key_travel).
message RgbEffectAnalogRgbFill {
  required bool use_gamepad_curve = 1;  // @0x0 bool. layer +4: as RgbEffectLevelMeter.use_gamepad_curve
}

// C struct: 2 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 9 (RgbEffectLayer tag 9): every pressed key and its neighbours are lit in proportion to the key depth; rendered in rgb_render_effect_layers.
message RgbEffectAnalogGlow {
  required uint32 base_level = 1;       // @0x0 uint8_t. layer +4: scale of unlit keys
  required bool use_gamepad_curve = 2;  // @0x1 bool. layer +5: as RgbEffectLevelMeter.use_gamepad_curve
}

// C struct: 2 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 8 (RgbEffectLayer tag 8): a lit square around every pressed key that grows with the key depth; rendered in rgb_render_effect_layers.
message RgbEffectAnalogSpotlight {
  required uint32 base_level = 1;       // @0x0 uint8_t. layer +4: scale of the keys outside every square
  required bool use_gamepad_curve = 2;  // @0x1 bool. layer +5: as RgbEffectLevelMeter.use_gamepad_curve
}

// C struct: 5 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 7 (RgbEffectLayer tag 7): bar graph of the deepest pressed key on the keys of row 1, columns 1..10; rgb_effect_render_level_meter, value fed by rgb_effects_feed_key_travel.
message RgbEffectLevelMeter {
  required uint32 base_level = 1;       // @0x0 uint8_t. layer +4: scale of the keys above the level
  required bool use_gamepad_curve = 2;  // @0x1 bool. layer +5: rgb_effects_feed_key_travel passes the travel through hid_gamepad_normalize_travel and hid_gamepad_apply_response_curve when set (and the USB gamepad mode is not 2), else uses the raw travel
  required uint32 f3 = 3;               // @0x2 uint8_t
  required uint32 f4 = 4;               // @0x3 uint8_t
  required uint32 f5 = 5;               // @0x4 uint8_t
}

// C struct: 8 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 6 (RgbEffectLayer tag 6): pressed keys light up and fade out; rgb_render_reactive_fade_effect.
message RgbEffectReactiveFade {
  required uint32 base_level = 1;           // @0x0 uint8_t. layer +4: brightness factor of idle keys
  required uint32 step_ms = 2;              // @0x1 uint8_t. layer +5: time per countdown step, 0 treated as 1, clamped to 40, times 8 in palette mode
  required uint32 flags = 3;                // @0x2 uint8_t. layer +6: bit 0 random palette colour per press, bit 1 fixed colour (ignored with bit 0), bit 2 inverted level
  optional uint32 color = 4 [default = 0];  // @0x4 uint32_t. layer +8: colour of fixed-colour mode; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
}

// C struct: 4 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 5 (RgbEffectLayer tag 5): ripple spreading from pressed keys, a cellular automaton run in rgb_render_effect_layers.
message RgbEffectKeyRipple {
  required uint32 flags = 1;             // @0x0 uint8_t. layer +4: bit 0 = cells drawn in palette colours, random colour per key press; bit 2 = levels inverted
  required uint32 steps_per_second = 2;  // @0x1 uint8_t. layer +5: ripple steps per second, clamped to 1..50
  required uint32 decay_step_ms = 3;     // @0x2 uint8_t. layer +6: period of the tail fade step in ms, 0 treated as 1
  required uint32 base_level = 4;        // @0x3 uint8_t. layer +7: level of idle keys / end level of the fade
}

// C struct: 2 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 4 (RgbEffectLayer tag 4): all keys in one colour that cycles through a hue range; rgb_effect_render_hue_cycle.
message RgbEffectHueCycle {
  required RgbHuePreset hue_preset = 1;  // @0x0 RgbHuePreset (1 byte). layer +4: hue range, see enum RgbHuePreset
  required uint32 period_250ms = 2;      // @0x1 uint8_t. layer +5: one cycle takes 250 * period ms
}

// C struct: 2 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 3 (RgbEffectLayer tag 3): fades all key LEDs up and down; rgb_effect_render_breathing. Field number 2 is not used.
message RgbEffectBreathing {
  required uint32 step_ms = 1;    // @0x0 uint8_t. layer +4: ms per level step of 2, clamped to 1..40
  required uint32 min_level = 3;  // @0x1 uint8_t. layer +5: scale at the dark end, scale = min + (255 - min) * level / 250
}

// C struct: 4 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 2 (RgbEffectLayer tag 2): a window of full brightness sweeping back and forth, the rest dimmed; rgb_effect_render_scanner.
message RgbEffectScanner {
  required uint32 width = 1;                         // @0x0 uint8_t. params[0]: window width in columns / rows (initial window end set by rgb_effect_reset_slot_state)
  required uint32 steps_per_second = 2;              // @0x1 uint8_t. params[1]: clamped to 1..60, one step every 1000 / value ms
  required uint32 outside_level = 3;                 // @0x2 uint8_t. params[2]: scale 0..255 applied to the LEDs outside the window
  required RgbScannerDirection start_direction = 4;  // @0x3 RgbScannerDirection (1 byte). params[3]: initial phase copied to state +2 by rgb_effect_reset_slot_state, see enum RgbScannerDirection
}

// C struct: 3 bytes; submessage, used by RgbEffectLayer.
// Parameters of effect kind 1 (RgbEffectLayer tag 1): hue gradient moving over the 17 columns, rendered in rgb_render_effect_layers.
message RgbEffectRainbowWave {
  required RgbHuePreset hue_preset = 1;  // @0x0 RgbHuePreset (1 byte). layer +4: hue range, see enum RgbHuePreset
  required uint32 period_250ms = 2;      // @0x1 uint8_t. layer +5: one hue cycle takes 250 * period ms (phase step per ms = 0x10000 / (250 * period))
  required uint32 direction = 3;         // @0x2 uint8_t. layer +6: non-zero = phase increases, zero = phase decreases and the range is run in the opposite order
}

// C struct: 4 bytes; submessage, used by LightbarBlink, LightbarMeter, LightbarMirror, LightbarProfileIndicator, LightbarStatic.
// Inclusive rectangle of key matrix positions, used by the light-bar effects in rgb_render_lightbar_effect (rows first.row..last.row, columns first.col..last.col, LED = g_rgb_key_to_led[17 * row + col]).
message KeyRect {
  required KeyPosition first = 1;  // @0x0 KeyPosition, 2 bytes. top-left corner: row at +0, col at +1
  required KeyPosition last = 2;   // @0x2 KeyPosition, 2 bytes. bottom-right corner, inclusive: row at +2, col at +3
}

// C struct: 2 bytes; submessage, used by LightbarBlink, LightbarCustom, LightbarMeter, LightbarMirror, LightbarProfileIndicator, LightbarStatic.
// Inclusive range of light-bar positions 0..9 (indices into k_lightbar_led_ids), target of the light-bar effects in rgb_render_lightbar_effect.
message LightbarRange {
  required uint32 first = 1;  // @0x0 uint8_t. first position, e.g. entry +0xAA of the static effect
  required uint32 last = 2;   // @0x1 uint8_t. last position, inclusive; positions above 9 are skipped
}

// C struct: 8 bytes; submessage, used by LightbarCompare, LightbarMeter, LightbarOperand, LightbarTrigger.
// Reference to an RGB signal (8 bytes), argument of rgb_signal_subscribe; used by light-bar conditions and the meter effect.
message SignalRef {
  required bool is_builtin = 1;  // @0x0 bool. true = entry of g_rgb_signal_table (keyboard signals 0..10), false = host-defined signal of g_rgb_host_signal_table
  required uint32 id = 2;        // @0x4 uint32_t. built-in signal number 0..10 or the 32-bit id chosen by the host
}

// C struct: 76 bytes; submessage, used by LightbarCondition.
// One group of a LightbarCondition (76 bytes): up to two terms combined by op; rgb_lightbar_eval_condition_group, rgb_lightbar_bind_condition_group.
message LightbarConditionGroup {
  required LightbarLogicOp op = 1;           // @0x0 LightbarLogicOp (1 byte). group +0: how the terms combine, see enum LightbarLogicOp
  repeated LightbarConditionTerm terms = 2;  // @0x4 LightbarConditionTerm, 36 bytes x 2, count @0x2. group +2 count, +4 two 36-byte terms evaluated by rgb_lightbar_eval_condition
}

// C struct: 16 bytes; submessage, used by RgbEffectLayerList.
// One effect layer of the rgb file (16 bytes: uint16 which = effect kind 1..15, parameter union at +4); the first 16 bytes of a 124-byte runtime layer of g_rgb_effect_layers are a verbatim copy made by rgb_effects_apply_layer_settings.
message RgbEffectLayer {
  oneof effect {                                    // uint16 which at +0 = effect kind, switched on by rgb_render_effect_layers
    RgbEffectRainbowWave rainbow_wave = 1;          // @0x4 RgbEffectRainbowWave, 3 bytes, which_ @0x0. kind 1, rendered in rgb_render_effect_layers
    RgbEffectScanner scanner = 2;                   // @0x4 RgbEffectScanner, 4 bytes, which_ @0x0. kind 2, rgb_effect_render_scanner
    RgbEffectBreathing breathing = 3;               // @0x4 RgbEffectBreathing, 2 bytes, which_ @0x0. kind 3, rgb_effect_render_breathing
    RgbEffectHueCycle hue_cycle = 4;                // @0x4 RgbEffectHueCycle, 2 bytes, which_ @0x0. kind 4, rgb_effect_render_hue_cycle
    RgbEffectKeyRipple key_ripple = 5;              // @0x4 RgbEffectKeyRipple, 4 bytes, which_ @0x0. kind 5, rendered in rgb_render_effect_layers, armed by rgb_effects_handle_key_event
    RgbEffectReactiveFade reactive_fade = 6;        // @0x4 RgbEffectReactiveFade, 8 bytes, which_ @0x0. kind 6, rgb_render_reactive_fade_effect
    RgbEffectLevelMeter level_meter = 7;            // @0x4 RgbEffectLevelMeter, 5 bytes, which_ @0x0. kind 7, rgb_effect_render_level_meter
    RgbEffectAnalogSpotlight analog_spotlight = 8;  // @0x4 RgbEffectAnalogSpotlight, 2 bytes, which_ @0x0. kind 8, rendered in rgb_render_effect_layers, fed by rgb_effects_feed_key_travel
    RgbEffectAnalogGlow analog_glow = 9;            // @0x4 RgbEffectAnalogGlow, 2 bytes, which_ @0x0. kind 9, rendered in rgb_render_effect_layers, fed by rgb_effects_feed_key_travel
    RgbEffectAnalogRgbFill analog_rgb_fill = 10;    // @0x4 RgbEffectAnalogRgbFill, 1 bytes, which_ @0x0. kind 10, rendered in rgb_render_effect_layers, fed by rgb_effects_feed_key_travel
    RgbEffectKeyTest key_test = 11;                 // @0x4 RgbEffectKeyTest, 1 bytes, which_ @0x0. kind 11, rendered in rgb_render_effect_layers, marks set by rgb_effects_handle_key_event
    Nameless08 f12 = 12;                            // @0x4 Nameless08, 12 bytes, which_ @0x0. kind 12: no case in the renderer, the state initialiser or the settings take-over; never drawn
    Nameless07 f13 = 13;                            // @0x4 Nameless07, 1 bytes, which_ @0x0. kind 13: rgb_effects_feed_key_travel stores per-key analog levels for it like for kinds 8 and 9, but the renderer has no case; never drawn
    RgbEffectSimplexNoise simplex_noise = 14;       // @0x4 RgbEffectSimplexNoise, 12 bytes, which_ @0x0. kind 14, rendered in rgb_render_effect_layers
    RgbEffectPolarGradient polar_gradient = 15;     // @0x4 RgbEffectPolarGradient, 12 bytes, which_ @0x0. kind 15, rendered in rgb_render_effect_layers
  }
}

// C struct: 42 bytes; submessage, used by KeyMatrixU16.
// Row type of KeyMatrixU16: 21 uint16 values, one per key column (only columns 0..16 map to keys).
message KeyMatrixU16Row {
  repeated uint32 values = 1;  // @0x0 uint16_t x 21. 21 values of one matrix row
}

// C struct: 21 bytes; submessage, used by KeyMatrixU8.
// Row type of KeyMatrixU8: 21 bytes, one per key column.
message KeyMatrixU8Row {
  required bytes values = 1;  // @0x0 uint8_t[21]. 21 per-key uint8 values of one matrix row
}

// C struct: 2 bytes; submessage, used by GamepadResponseCurve.
// One point of GamepadResponseCurve (2 bytes), read by hid_gamepad_apply_response_curve.
message GamepadCurvePoint {
  required uint32 x = 1;  // @0x0 uint8_t. key travel / 255 of the full travel
  required uint32 y = 2;  // @0x1 uint8_t. axis output / 255 of full deflection
}

// C struct: 34 bytes; submessage, used by LightbarEntry.
// LightbarEntry effect type 7 (entry +0xA4, 34 bytes): one colour per light-bar LED, painted by rgb_render_lightbar_effect.
message LightbarCustom {
  required bytes colors = 1;         // @0x0 pb_bytes_array_t, 32 bytes. bytes at entry +0xA6: r, g, b of light-bar position i at 3 * i for i = 0..9, i.e. up to 30 bytes (max_size 30)
  required LightbarRange range = 2;  // @0x20 LightbarRange, 2 bytes. entry +0xC4, +0xC5: positions drawn
}

// C struct: 12 bytes; submessage, used by LightbarEntry.
// LightbarEntry effect type 6 (entry +0xA4, 12 bytes): one colour on a light-bar range or a key rectangle, painted by rgb_render_lightbar_effect.
message LightbarStatic {
  required uint32 color = 1;  // @0x0 uint32_t. entry +0xA4; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  oneof target {              // uint16 which at entry +0xA8
    LightbarRange range = 2;  // @0x6 LightbarRange, 2 bytes, which_ @0x4. which_target == 2: light-bar range at entry +0xAA, +0xAB
    KeyRect rect = 3;         // @0x6 KeyRect, 4 bytes, which_ @0x4. any other which_target: key rectangle at entry +0xAA..+0xAD
  }
}

// C struct: 24 bytes; submessage, used by LightbarEntry.
// LightbarEntry effect type 5 (entry +0xA4, 24 bytes): periodic blend between two colours on a light-bar range or a key rectangle, painted by rgb_render_lightbar_effect.
message LightbarBlink {
  required uint32 color_a = 1;                  // @0x0 uint32_t. entry +0xA4; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  optional uint32 color_b = 2;                  // @0x8 uint32_t, has_ @0x4. entry +0xA8 has-flag, +0xAC: second colour, black with alpha 0 when absent; packed colour
  required uint32 period_ms = 3;                // @0xC uint16_t. entry +0xB0: phase = (phase + elapsed ms) % period_ms; 0 is not guarded
  optional LightbarBlinkWaveform waveform = 4;  // @0xF LightbarBlinkWaveform (1 byte), has_ @0xE. entry +0xB3 (has-flag +0xB2 not tested): see enum LightbarBlinkWaveform
  oneof target {                                // uint16 which at entry +0xB4
    LightbarRange range = 5;                    // @0x12 LightbarRange, 2 bytes, which_ @0x10. which_target == 5: light-bar range at entry +0xB6, +0xB7
    KeyRect rect = 6;                           // @0x12 KeyRect, 4 bytes, which_ @0x10. any other which_target: key rectangle at entry +0xB6..+0xB9
  }
}

// C struct: 6 bytes; submessage, used by LightbarEntry.
// LightbarEntry effect type 4 (entry +0xA4, 6 bytes): resamples the frame colours of a row of keys onto a light-bar range, painted by rgb_render_lightbar_effect.
message LightbarMirror {
  required LightbarRange range = 1;  // @0x0 LightbarRange, 2 bytes. entry +0xA4, +0xA5: destination light-bar positions
  required KeyRect source = 2;       // @0x2 KeyRect, 4 bytes. entry +0xA6..+0xA9: keys sampled along row first.row from first.col; sample count = last.col + 1 - first.col when both rows are equal, else last.row + 1 - first.row
}

// C struct: 20 bytes; submessage, used by LightbarEntry.
// LightbarEntry effect type 3 (entry +0xA4, 20 bytes): lights the segment of the active profile in the profile colour, painted by rgb_render_lightbar_effect; subscribes signals 0, 6, 10.
message LightbarProfileIndicator {
  oneof target {                                           // uint16 which at entry +0xA4, must be 1
    LightbarRange range = 1;                               // @0x2 LightbarRange, 2 bytes, which_ @0x0. which_target == 1: light-bar range
    KeyRect rect = 2;                                      // @0x2 KeyRect, 4 bytes, which_ @0x0. which_target == 2: accepted by the schema, but the painter returns without drawing
  }
  required LightbarProfileBackground background_mode = 3;  // @0x6 LightbarProfileBackground (1 byte). entry +0xAA: see enum LightbarProfileBackground (rgb_lightbar_resolve_profile_color)
  optional uint32 background_color = 4;                    // @0x8 uint32_t, has_ @0x7. entry +0xAB has-flag, +0xAC: colour of background mode 2; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  optional uint32 segment_count = 5;                       // @0x10 uint32_t, has_ @0xC. entry +0xB0 has-flag, +0xB4: segment length = min(LED count / segment_count, LED count / number of profiles), 1 when absent; segment start = first + length * min(profile index, 4). The factory glb file uses 5
}

// C struct: 40 bytes; submessage, used by LightbarEntry.
// LightbarEntry effect type 2 (entry +0xA4, 40 bytes): bar graph of one signal on a light-bar range, painted by rgb_render_lightbar_effect; value delivered by rgb_lightbar_notify_signal.
message LightbarMeter {
  required SignalRef signal = 1;                // @0x0 SignalRef, 8 bytes. entry +0xA4: signal shown, subscribed by rgb_lightbar_init_item_state; with a host signal the effect is drawn only while g_rgb_host_signals_active is set
  required float max_value = 2;                 // @0x8 float. entry +0xAC: full-scale value, lit length = value / max_value * LED count; read as a float, hence float and not fixed32
  required uint32 color = 3;                    // @0xC uint32_t. entry +0xB0: colour of the lit LEDs, end colour of the gradient; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  optional uint32 background_color = 4;         // @0x14 uint32_t, has_ @0x10. entry +0xB4 has-flag, +0xB8: colour of the unlit LEDs; absent = unlit LEDs keep the frame colour; packed colour
  oneof target {                                // uint16 which at entry +0xBC, must be 5
    LightbarRange range = 5;                    // @0x1A LightbarRange, 2 bytes, which_ @0x18. which_target == 5: light-bar range
    KeyRect rect = 6;                           // @0x1A KeyRect, 4 bytes, which_ @0x18. which_target == 6: accepted by the schema, but the painter returns without drawing
  }
  optional bool reverse = 7 [default = false];  // @0x1F bool, has_ @0x1E. entry +0xC2 has-flag, +0xC3: true = fill from the last position downwards
  optional uint32 gradient_start_color = 8;     // @0x24 uint32_t, has_ @0x20. entry +0xC4 has-flag, +0xC8: colour at the start of the bar, LED colour = blend (gradient_start_color, color, 255 * i / count); packed colour
}

// C struct: 156 bytes; submessage, used by LightbarEntry.
// LightbarEntry tag 1 (entry +4, 156 bytes): condition expression of up to two groups, evaluated in rgb_render_lightbar_effect, bound by rgb_lightbar_init_item_state.
message LightbarCondition {
  required LightbarLogicOp op = 1;             // @0x0 LightbarLogicOp (1 byte). entry +4: how the groups combine, see enum LightbarLogicOp
  repeated LightbarConditionGroup groups = 2;  // @0x4 LightbarConditionGroup, 76 bytes x 2, count @0x2. entry +6 count, +8 two 76-byte groups evaluated by rgb_lightbar_eval_condition_group
}

// C struct: 100 bytes; submessage, used by RgbSettings.
// RgbSettings oneof tag 4: count (uint16 at g_rgb_settings +0x20) and up to 6 layer entries of 16 bytes from +0x24, copied by rgb_effects_apply_layer_settings into g_rgb_effect_layers.
message RgbEffectLayerList {
  repeated RgbEffectLayer layers = 1;  // @0x4 RgbEffectLayer, 16 bytes x 6, count @0x0. rendered in list order, each on top of the previous ones, by rgb_render_effect_layers
}

// C struct: 8 bytes; submessage, used by RgbSettings.
// Old single-effect form of the rgb file (RgbSettings oneof tag 3, 8 bytes at g_rgb_settings +0x20), converted to an effect layer by rgb_settings_convert_legacy_effect.
message RgbLegacyEffect {
  required RgbEffectKind effect = 1;             // @0x0 RgbEffectKind (1 byte). switch value of rgb_settings_convert_legacy_effect, becomes the layer kind
  required uint32 base_level_index = 2;          // @0x1 uint8_t. when base_level is absent the level is (uint8)(38 * base_level_index)
  required RgbLegacySpeed speed = 3;             // @0x2 RgbLegacySpeed (1 byte). 0 / 1 / 2 translated per effect, see enum RgbLegacySpeed
  required uint32 color_mode = 4;                // @0x3 uint8_t. effects 1 and 4 copy it to hue_preset (RgbHuePreset values), effect 5 sets flags bit 0 when non-zero, effect 6 sets flags bit 0 when it equals 1 (random palette colours)
  required uint32 scanner_width = 5;             // @0x4 uint8_t. only effect 2 uses it, copied to RgbEffectScanner.width
  required uint32 f6 = 6;                        // @0x5 uint8_t. effect 1 copies it to RgbEffectRainbowWave.direction; effects 7..10 set use_gamepad_curve when it is 0. Two unrelated uses, so no name
  optional uint32 base_level = 7 [default = 0];  // @0x7 uint8_t, has_ @0x6. exact 8-bit level, copied to the level parameter of effects 2, 3, 6, 7, 8, 9, 11; effect 5 switches to inverted levels when it is above 170
}

// C struct: 28 bytes; submessage, used by RgbSettings.
// First member of RgbSettings (g_rgb_settings +0x00..+0x1B): key brightness and the four lock-indicator colours read by rgb_set_lock_indicator.
message RgbBaseSettings {
  required uint32 brightness = 1 [default = 255];           // @0x0 uint8_t. g_rgb_settings[0]: key LED brightness 0..255, stepped by rgb_step_brightness, applied by rgb_apply_brightness_change
  required uint32 caps_lock_color = 2 [default = 65535];    // @0x4 uint32_t. g_rgb_settings +0x04, indicator 0 of rgb_set_lock_indicator; packed colour decoded by rgb_unpack_color: bit 31 clear = RGB565 in bits 15:0, bit 31 set = RGB888 in bits 23:0 with a 7-bit alpha in bits 30:24
  required uint32 layer_lock_color = 3 [default = 65535];   // @0x8 uint32_t. g_rgb_settings +0x08, indicator 3 (Fn-layer lock) of rgb_set_lock_indicator, also the overlay colour of a latched toggle key bound to a layer key (keys_process_scan_pass); packed colour as caps_lock_color
  optional uint32 scroll_lock_color = 4 [default = 65535];  // @0x10 uint32_t, has_ @0xC. g_rgb_settings +0x10, indicator 1 of rgb_set_lock_indicator (has-flag not tested); packed colour
  optional uint32 num_lock_color = 5 [default = 65535];     // @0x18 uint32_t, has_ @0x14. g_rgb_settings +0x18, indicator 2 of rgb_set_lock_indicator (has-flag not tested); packed colour
}

// C struct: 18 bytes; submessage, used by ProfileConfigFile.
// General key settings of a profile, the 18-byte struct that profile_apply_cfg copies into the live key settings and profile_export_cfg rebuilds from them; only member of ProfileConfigFile.
message ProfileConfig {
  required uint32 actuation_point = 1 [default = 180];                  // @0x0 uint16_t. g_keys_actuation_point, profile-wide actuation point in the distance encoding of keys_sanitize_distance / keys_get_actuation_threshold: 1..255 = v/255 of the full switch travel, 0x4000 | n = n/0x3FFF of the full travel, 0 = not set
  required bool keyboard_enabled_in_gamepad_mode = 2 [default = true];  // @0x2 bool. g_hid_kbd_enabled_in_gamepad_mode: when false and the USB gamepad mode is not 2, keys_apply_key_action drops the keyboard usages of plain keys
  required bool rapid_trigger_enabled = 3 [default = false];            // @0x3 bool. g_keys_rapid_trigger_enabled, used by keys_update_press_state for keys without a per-key override
  optional uint32 rapid_trigger_sensitivity = 4 [default = 65];         // @0x6 uint16_t, has_ @0x4. g_keys_rapid_trigger_params +0: press sensitivity, and release sensitivity when no separate one is set; distance encoding of keys_sanitize_distance / keys_get_actuation_threshold: 1..255 = v/255 of the full switch travel, 0x4000 | n = n/0x3FFF of the full travel, 0 = not set
  required bool scan_mode_enabled = 5 [default = false];                // @0x8 bool. profile_apply_cfg: scan mode = scan_mode_enabled ? min(scan_mode, 1) : 0, written to g_run_state_flags bits 7:5 and g_adc_scan_mode_requested
  optional TapDuration tap_duration = 6 [default = TAP_DURATION_40MS];  // @0xA TapDuration (1 byte), has_ @0x9. g_keys_tap_duration_preset; see enum TapDuration
  optional bool rapid_trigger_non_continuous = 7 [default = false];     // @0xC bool, has_ @0xB. profile_apply_cfg stores value ^ 1 in g_keys_rapid_trigger_params +7, the "continuous" flag of keys_update_press_state (set = rapid trigger stays engaged until the travel is 0, clear = it disengages below actuation point - 96); the has-flag goes to +6 and is not tested there. true = rapid trigger limited to the zone below the actuation point
  optional uint32 rapid_trigger_release_sensitivity = 8 [default = 0];  // @0xE uint16_t, has_ @0xD. g_keys_rapid_trigger_params +4, has-flag to +2: separate release sensitivity of keys_update_press_state; distance encoding of keys_sanitize_distance / keys_get_actuation_threshold: 1..255 = v/255 of the full switch travel, 0x4000 | n = n/0x3FFF of the full travel, 0 = not set
  optional ScanMode scan_mode = 9 [default = SCAN_MODE_PARALLEL];       // @0x11 ScanMode (1 byte), has_ @0x10. see scan_mode_enabled and enum ScanMode; profile_export_cfg writes g_run_state_flags >> 5 here
}

// C struct: 204 bytes; submessage, used by ActuationPoints.
// Sparse per-key list with 16-bit values (204 bytes: uint16 count, 50 x uint32): ActuationPoints tag 4, decoded by keys_apply_actuation_map case 4 and built by protocol_cmd_get_actuation_points.
message KeyValueListU16 {
  repeated uint32 items = 1;  // @0x4 uint32_t x 50, count @0x0. each item: byte 0 = key id = row << 5 | col of the 6 x 17 key matrix, bits 31:16 = value
}

// C struct: 252 bytes; submessage, used by ActuationPoints.
// Dense 6 x 21 matrix of 16-bit per-key values (252 bytes): ActuationPoints tag 3, read by keys_apply_actuation_map case 3 (rows of 42 bytes).
message KeyMatrixU16 {
  repeated KeyMatrixU16Row rows = 1;  // @0x0 KeyMatrixU16Row, 42 bytes x 6. fixed array of 6 rows
}

// C struct: 102 bytes; submessage, used by ActuationPoints, KeyByteMap.
// Sparse per-key list with 8-bit values (102 bytes: uint16 count, 50 x uint16): member of ActuationPoints (tag 2) and KeyByteMap (tag 2); items decoded by keys_apply_actuation_map case 2 and keys_apply_gamepad_map.
message KeyValueListU8 {
  repeated uint32 items = 1;  // @0x2 uint16_t x 50, count @0x0. each item: low byte = key id = row << 5 | col of the 6 x 17 key matrix, high byte = value
}

// C struct: 3 bytes; submessage, used by LightbarColors, ProfileInfo.
// Three required bytes; as ProfileInfo.color packed by protocol_cmd_set_profile_info into 0xFF000000 | r << 16 | g << 8 | b (0xFFRRGGBB, the format rgb565_to_rgb888 returns); element {r,g,b} of LightbarColors.
message RgbColor {
  required uint32 r = 1;  // @0x0 uint8_t. bits 23:16 of the 0xFFRRGGBB value built by protocol_cmd_set_profile_info; factory colours set by profile_create_factory_defaults: Rapid Profile (255, 40, 40), Typing Profile (0, 0, 255)
  required uint32 g = 2;  // @0x1 uint8_t. bits 15:8 of the same value
  required uint32 b = 3;  // @0x2 uint8_t. bits 7:0 of the same value
}

// C struct: 7 bytes; submessage, used by GamepadSettings.
// GamepadSettings tag 2 (7 bytes at g_hid_gamepad_settings +8): stick shaping options of hid_gamepad_shape_stick and hid_gamepad_combine_axis.
message GamepadStickOptions {
  required bool left_stick_up_bias_enabled = 1 [default = false];  // @0x0 bool. settings +8: together with a present left_stick_up_x_percent enables the weighting of the left stick while y < 0 (hid_gamepad_shape_stick)
  optional StickNormalization normalization = 2;                   // @0x2 StickNormalization (1 byte), has_ @0x1. settings +9 has-flag, +0xA value: see enum StickNormalization
  optional bool single_direction_axes = 3 [default = false];       // @0x4 bool, has_ @0x3. settings +0xB has-flag, +0xC value: true = of two opposing keys of one axis only one direction counts (deeper / later one, hid_gamepad_combine_axis) instead of their difference
  optional uint32 left_stick_up_x_percent = 4 [default = 50];      // @0x6 uint8_t, has_ @0x5. settings +0xD has-flag, +0xE value p (default 50): left stick with y < 0 uses x * p / 100 and y * (1 - p / 100) instead of x / 2 and y / 2 before normalising
}

// C struct: 8 bytes; submessage, used by GamepadSettings.
// GamepadSettings tag 1 (8 bytes): four points of the piecewise-linear travel-to-axis curve of hid_gamepad_apply_response_curve; the x of the first and last point are the dead zone and saturation limits of hid_gamepad_normalize_travel.
message GamepadResponseCurve {
  repeated GamepadCurvePoint points = 1;  // @0x0 GamepadCurvePoint, 2 bytes x 4. fixed array of 4 points in ascending x order
}

// C struct: 204 bytes; submessage, used by GlobalLightbarConfig, LightbarConfig.
// One light-bar entry (204 bytes) of LightbarConfig / GlobalLightbarConfig: optional condition plus one effect, evaluated and drawn by rgb_render_lightbar_effect, bound to signals by rgb_lightbar_init_item_state.
message LightbarEntry {
  optional LightbarCondition condition = 1;          // @0x4 LightbarCondition, 156 bytes, has_ @0x0. entry +0 has-flag: 0 = effect always drawn; otherwise the condition is evaluated first
  oneof effect {                                     // uint16 which at entry +0xA0 = effect type 2..7, switched on by rgb_render_lightbar_effect
    LightbarMeter meter = 2;                         // @0xA4 LightbarMeter, 40 bytes, which_ @0xA0. which_effect == 2
    LightbarProfileIndicator profile_indicator = 3;  // @0xA4 LightbarProfileIndicator, 20 bytes, which_ @0xA0. which_effect == 3
    LightbarMirror mirror = 4;                       // @0xA4 LightbarMirror, 6 bytes, which_ @0xA0. which_effect == 4
    LightbarBlink blink = 5;                         // @0xA4 LightbarBlink, 24 bytes, which_ @0xA0. which_effect == 5
    LightbarStatic static_color = 6;                 // @0xA4 LightbarStatic, 12 bytes, which_ @0xA0. which_effect == 6 (not named static: C keyword)
    LightbarCustom custom = 7;                       // @0xA4 LightbarCustom, 34 bytes, which_ @0xA0. which_effect == 7
  }
}

// C struct: 4 bytes; submessage, used by GlobalSettings.
// GlobalSettings tag 1 (g_profile_global_settings +1..+4): LED idle timer of rgb_update_frame.
message IdleSettings {
  required uint32 dim_after_minutes = 1 [default = 5];   // @0x0 uint8_t. idle minutes until the LEDs are dimmed (overlay 0x1E); default 5
  required uint32 off_after_minutes = 2 [default = 10];  // @0x1 uint8_t. idle minutes until the LEDs are switched off; default 10
  optional bool off_enabled = 3 [default = true];        // @0x3 bool, has_ @0x2. false = never switch the LEDs off (tested only when the field is present); default true
}

// C struct: 126 bytes; top-level.
// Host transfer format of one key map layer (littlefs file <profile>/ml<k>, raw 6 rows x 21 key codes); encoded by protocol_cmd_get_keymap_layer, decoded by protocol_cmd_set_keymap_layer.
message KeymapLayer {
  repeated KeymapLayerRow rows = 1;  // @0x0 KeymapLayerRow, 21 bytes x 6. fixed array of 6 rows of 21 bytes, the 126-byte ml<k> layout
}

// C struct: 164 bytes; top-level.
// Reply of protocol_cmd_get_host_signals (feature command 0x41): the host-defined signals the current light-bar configuration subscribes to, from g_rgb_host_signal_table.
message HostSignalList {
  repeated HostSignalListEntry signals = 1;  // @0x4 HostSignalListEntry, 8 bytes x 20, count @0x0. one item per registered host signal, up to 20
}

// C struct: 126 bytes; top-level.
// Content of littlefs file <profile>/lbm. max_encoded_size 136 is the encode buffer size that protocol_report_save_lbm passes to storage_write_profile_pb_file. Sent by protocol_cmd_get_lbm_file (feature command 0x46), received by protocol_report_save_lbm (OUT-report command 0x22). The firmware stores and returns the message without reading it.
message LbmFile {
  repeated Nameless09 f1 = 1;  // @0x2 Nameless09, 31 bytes x 4, count @0x0
}

// C struct: 32 bytes; top-level.
// Up to 10 three-byte colours; encoded by protocol_cmd_get_lightbar_colors, decoded by protocol_report_set_lightbar_colors.
message LightbarColors {
  repeated RgbColor colors = 1;  // @0x2 RgbColor, 3 bytes x 10, count @0x0. up to 10 RgbColor elements
}

// C struct: 126 bytes; top-level.
// 3 rows of 21 RGB565 colours, used to transfer half of a 6 x 21 colour map (base colours clr / layer colours r<k>).
message ColorRows {
  repeated ColorRow rows = 1;  // @0x0 ColorRow, 42 bytes x 3. 3 rows of 21 uint16 each
}

// C struct: 766 bytes; top-level.
// List of up to 127 six-byte switch-type entries plus a total count; reply of protocol_cmd_get_switch_types.
message SwitchTypeList {
  repeated SwitchTypeEntry entries = 1;  // @0x2 SwitchTypeEntry, 6 bytes x 127, count @0x0. one 6-byte entry per switch type
  optional uint32 total_count = 2;       // @0x2FD uint8_t, has_ @0x2FC. total count
}

// C struct: 126 bytes; top-level.
// Content of littlefs file glbm. max_encoded_size 136 is the encode buffer size that protocol_cmd_save_glbm passes to storage_write_file. Same layout as LbmFile but a separate message. Sent by protocol_cmd_get_glbm (feature command 71), received by protocol_cmd_save_glbm (OUT-report command 35). The firmware stores and returns the message without reading it.
message GlbmFile {
  repeated Nameless09 f1 = 1;  // @0x2 Nameless09, 31 bytes x 4, count @0x0
}

// C struct: 672 bytes; top-level.
// Content of littlefs file sw, RAM copy g_analog_switch_profiles (672 bytes): which hall switch type sits under which keys, loaded by analog_load_switch_profiles, applied by analog_apply_switch_profiles. Sent by protocol_cmd_get_switch_profiles (feature command 82), received by protocol_cmd_set_switch_profiles (OUT-report command 40, written through a 1240-byte buffer).
message SwitchProfiles {
  repeated SwitchProfileEntry entries = 1;    // @0x2 SwitchProfileEntry, 22 bytes x 30, count @0x0. up to 30 entries of 22 bytes
  optional SwitchParams default_params = 2;   // @0x298 SwitchParams, 6 bytes, has_ @0x296. struct +0x296 has-flag, +0x298: switch of every key not listed in an entry
  optional uint32 version = 3 [default = 0];  // @0x29F uint8_t, has_ @0x29E. struct +0x29E has-flag, +0x29F: 1 = current; absent or 0 = old file whose travel offsets are doubled on load, then set to 1 (analog_load_switch_profiles)
}

// C struct: 164 bytes; top-level.
// One page of the advanced-key list on the wire (164 bytes): reply of protocol_cmd_get_advanced_keys (feature command 52) and payload of protocol_cmd_set_advanced_keys (OUT-report command 24).
message AdvancedKeysPage {
  repeated AdvancedKey entries = 1;  // @0x2 AdvancedKey, 16 bytes x 10, count @0x0. up to 10 entries of this page
  required uint32 first_index = 2;   // @0xA2 uint8_t. list index of the first entry of the page
  required uint32 total_count = 3;   // @0xA3 uint8_t. get: number of entries of the whole list; ignored by set
}

// C struct: 164 bytes; top-level.
// Payload of report command 31, decoded by protocol_cmd_set_host_signals.
message HostSignalValues {
  repeated HostSignalValue values = 1;  // @0x4 HostSignalValue, 8 bytes x 20, count @0x0. up to 20 {index, value} items
}

// C struct: 8 bytes; submessage, used by HostSignalValues.
// Item type of HostSignalValues.
message HostSignalValue {
  required uint32 index = 1;  // @0x0 uint8_t. protocol_cmd_set_host_signals uses it as index into the 44-byte records of g_rgb_host_signal_table (bounded by the count byte of the table)
  required float value = 2;   // @0x4 float. protocol_cmd_set_host_signals compares and stores it as a float (record offset +8)
}

// C struct: 8 bytes; submessage, used by HostSignalList.
// Item of HostSignalList (8 bytes), filled by protocol_cmd_get_host_signals.
message HostSignalListEntry {
  required uint32 index = 1;  // @0x0 uint8_t. position in g_rgb_host_signal_table; the host addresses the signal by it in HostSignalValue.index
  required uint32 id = 2;     // @0x4 uint32_t. the 32-bit id the light-bar entry gave in SignalRef.id (table entry +0)
}

// C struct: 31 bytes; submessage, used by GlbmFile, LbmFile.
// Entry of LbmFile / GlbmFile: one string of up to 30 characters. Never interpreted by the firmware; the files hold up to 4 of them, as many as a light-bar config has entries. The message and field names are chosen by this project; the stored format only depends on the field numbers.
message Nameless09 {
  required string f1 = 1;  // @0x0 char[31]
}

// C struct: 42 bytes; submessage, used by ColorRows.
// Row type of ColorRows: 21 uint16 RGB565 colours.
message ColorRow {
  repeated uint32 rgb565 = 1;  // @0x0 uint16_t x 21. 21 RGB565 colours of one row
}

// C struct: 6 bytes; submessage, used by SwitchTypeList.
// Entry type of SwitchTypeList, filled by protocol_cmd_get_switch_types.
message SwitchTypeEntry {
  required SwitchType id = 1;         // @0x0 SwitchType (1 byte). switch type id first..48; same value range as SwitchParams.switch_type, hence the same enum. With one enum field an entry encodes to at most 16 bytes, so the 127 entries of max_count plus total_count give SwitchTypeList_size 2035, the largest list that fits the 2040-byte reply payload
  required uint32 f2 = 2;             // @0x1 uint8_t. always 20; meaning unknown
  required uint32 f3 = 3;             // @0x2 uint8_t. always 2; meaning unknown
  required uint32 travel_0p05mm = 4;  // @0x3 uint8_t. k_analog_switch_travel[id]: total travel of the switch type in 0.05 mm units
  optional uint32 f5 = 5;             // @0x5 uint8_t, has_ @0x4. k_analog_switch_group_id[id], values 0..16; meaning unknown
}

// C struct: 20 bytes; submessage, used by SwitchProfileEntry.
// SwitchProfileEntry tag 1 (20 bytes): keys that carry the same switch; analog_apply_switch_profiles copies the run-time params built by analog_build_switch_params to every listed key.
message SwitchKeyGroup {
  repeated uint32 key_ids = 1;       // @0x2 uint8_t x 10, count @0x0. entry +2 count, +4 up to 10 key ids (key id = row << 5 | col of the 6 x 17 key matrix)
  optional SwitchParams params = 2;  // @0xE SwitchParams, 6 bytes, has_ @0xC. entry +0xE has-flag, +0x10: switch of these keys
}

// C struct: 6 bytes; submessage, used by SwitchKeyGroup, SwitchProfiles.
// Switch description (6 bytes: uint16 which, switch type at +2, optional travel offset at +3 / +4), input of analog_build_switch_params; used by SwitchKeyGroup and SwitchProfiles.default_params.
message SwitchParams {
  oneof type {                        // uint16 which at +0 with a single member (protocol_cmd_get_switch_profiles tests 1 / 0)
    SwitchType switch_type = 1;       // @0x2 SwitchType (1 byte), which_ @0x0. which == 1: switch type id, index of the per-type tables (analog_build_switch_params); which == 0 = no switch chosen
  }
  optional uint32 travel_offset = 3;  // @0x4 uint8_t, has_ @0x3. has-flag at +3, value at +4: subtracted from the total travel of the switch type, in the 0.05 mm units of k_analog_switch_travel (analog_build_switch_params); files without version 1 hold half that resolution and are doubled on load (analog_load_switch_profiles)
}

// C struct: 22 bytes; submessage, used by SwitchProfiles.
// Entry of SwitchProfiles (22 bytes: uint16 which, union at +2) with a single oneof member; analog_apply_switch_profiles uses entries with which == 1.
message SwitchProfileEntry {
  oneof kind {                     // uint16 which at entry +0, only value 1 exists
    SwitchKeyGroup key_group = 1;  // @0x2 SwitchKeyGroup, 20 bytes, which_ @0x0. which == 1: a list of keys and their switch
  }
}

// C struct: 21 bytes; submessage, used by KeymapLayer.
// Row type of KeymapLayer: 21 key codes.
message KeymapLayerRow {
  required bytes keycodes = 1;  // @0x0 uint8_t[21]. 21 one-byte key codes of one row
}

// C struct: 648 bytes; top-level.
// Payload of the unsolicited 0xEE host notification built by protocol_send_event.
message Event {
  oneof event {                                   // uint16 which at +0 written by the senders; the tags are the event numbers of protocol_cmd_subscribe_event
    ProfileActivatedEvent profile_activated = 1;  // @0x4 ProfileActivatedEvent, 12 bytes, which_ @0x0. which == 1: sent by profile_activate when the host subscribed to tag 1
    LightbarChangedEvent lightbar_changed = 2;    // @0x4 LightbarChangedEvent, 1 bytes, which_ @0x0. which == 2: sent by protocol_send_lightbar_changed_event after rgb_lightbar_rebind_signals rebuilt the signal bindings (the host then re-reads HostSignalList)
    Nameless11 f3 = 3;                            // @0x4 Nameless11, 644 bytes, which_ @0x0. which == 3: never built by the firmware and not subscribable (protocol_cmd_subscribe_event rejects tag 3)
    ProfilesChangedEvent profiles_changed = 4;    // @0x4 ProfilesChangedEvent, 1 bytes, which_ @0x0. which == 4: sent by protocol_send_profiles_changed_event after a profile was deleted and by protocol_cmd_set_al_file after an al<k> change
  }
}

// C struct: 5 bytes; top-level.
// Content of littlefs file ds (5 bytes): keyboard-wide USB settings. storage_load_device_settings / storage_save_device_settings convert it from / to the packed 7-byte block of feature command 19 (protocol_cmd_get_device_config) and OUT-report command 7 (protocol_report_cmd_set_device_config); encoded into an 8-byte buffer.
message DeviceSettings {
  required bool nkro_enabled = 1 [default = true];                                               // @0x0 bool. block byte 0 bit 4 = !value; the bit selects the 6KRO keyboard descriptor (g_run_state_flags bits 1 + 2, set by settings_load_and_apply), so true = NKRO; default true
  required UsbGamepadMode usb_gamepad_mode = 2;                                                  // @0x1 UsbGamepadMode (1 byte). block byte 6 bits 2:1, copied to g_usb_link_flags bits 1:0 by settings_apply_usb_mode; see enum UsbGamepadMode
  required bool usb_full_speed = 3 [default = false];                                            // @0x2 bool. block byte 0 bit 3 -> g_run_state_options bit 1: force USB full speed on the high-speed PHY (usb_speed_option_init limits the controller to full speed)
  optional GamepadPollInterval gamepad_poll_interval = 4 [default = GAMEPAD_POLL_INTERVAL_1MS];  // @0x4 GamepadPollInterval (1 byte), has_ @0x3. block byte 6 bits 4:3 (1 when absent, 3 stored as 1 by storage_save_device_settings), copied to g_usb_gamepad_poll_rate by settings_apply_usb_mode; see enum GamepadPollInterval
}

// C struct: 20 bytes; submessage, used by Nameless11.
// Record of Nameless11 (event tag 3): uint32, uint32, two fixed32 words, uint32. Never built by the firmware. The message and field names are chosen by this project; the stored format only depends on the field numbers.
message Nameless10 {
  required uint32 f1 = 1;   // @0x0 uint32_t
  required uint32 f2 = 2;   // @0x4 uint32_t
  required fixed32 f3 = 3;  // @0x8 uint32_t
  required fixed32 f4 = 4;  // @0xC uint32_t
  required uint32 f5 = 5;   // @0x10 uint32_t
}

// C struct: 1 byte; submessage, used by Event.
// Event tag 4, no fields: stored profile data changed; sent by protocol_send_profiles_changed_event (after a profile delete) and protocol_cmd_set_al_file.
message ProfilesChangedEvent {
}

// C struct: 644 bytes; submessage, used by Event.
// Event tag 3: up to 32 records of 20 bytes. The firmware never builds this event and protocol_cmd_subscribe_event rejects tag 3, so the meaning is unknown. The message and field names are chosen by this project; the stored format only depends on the field numbers.
message Nameless11 {
  repeated Nameless10 f1 = 1;  // @0x4 Nameless10, 20 bytes x 32, count @0x0
}

// C struct: 1 byte; submessage, used by Event.
// Event tag 2, no fields: the light-bar signal bindings were rebuilt; sent by protocol_send_lightbar_changed_event (only caller rgb_lightbar_rebind_signals).
message LightbarChangedEvent {
}

// C struct: 12 bytes; submessage, used by Event.
// Event tag 1: the active profile changed; filled by profile_activate.
message ProfileActivatedEvent {
  required uint32 profile_index = 1;      // @0x0 uint32_t. event +4: index of the new active profile
  optional uint32 profile_namespace = 2;  // @0x8 uint32_t, has_ @0x4. event +8 has-flag (always set), +0xC: namespace of the profile, 0 = <n>/, 1 = lp/<n>/
}
