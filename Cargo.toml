[workspace]
members = ["boards/*", "boards/*/firmware", "crates/*", "xtask"]
default-members = [
    "crates/openwoot",
    "crates/openwoot-cli",
    "crates/openwoot-drivers",
    "crates/openwoot-gui",
    "crates/openwoot-host",
    "crates/openwoot-image",
    "crates/openwoot-protocol",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.100"

[workspace.dependencies]
anyhow = "=1.0.104"
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "screenshot"] }
assert_cmd = "=2.2.2"
async-channel = "=2.5.0"
async-hid = "=0.5.3"
async-io = "=2.6.0"
atomic-waker = { version = "=1.1.2", default-features = false }
auto-launch = "=0.6.0"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.9", features = ["derive"] }
cortex-m = "=0.7.10"
cortex-m-rt = "=0.7.7"
critical-section = "=1.2.0"
embassy-executor = "=0.10.0"
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"
embassy-time-driver = "=0.2.2"
embassy-time-queue-utils = "=0.3.2"
embassy-usb = { version = "=0.6.0", default-features = false, features = ["max-interface-count-5"] }
embassy-usb-driver = "=0.2.2"
embassy-usb-synopsys-otg = "=0.4.0"
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-storage-async = "=0.4.2"
futures-lite = "=2.6.1"
gd32f303-pac = { path = "crates/gd32f303-pac" }
gd32f425-pac = { path = "crates/gd32f425-pac" }
gimli = { version = "=0.34.0", default-features = false, features = ["read", "std"] }
gpui-kit = "=0.11.0"
heapless = { version = "=0.9.4", features = ["serde"] }
ihex = "=3.0.0"
indicatif = { version = "=0.18.6", default-features = false, features = ["unicode-width"] }
libm = "=0.2.16"
moxcms = "=0.8.1"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSRunningApplication",
    "NSWorkspace",
    "std",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "CGColorSpace",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGWindow",
    "std",
] }
object = { version = "=0.41.0", default-features = false, features = ["elf", "read_core", "std"] }
openwoot = { path = "crates/openwoot" }
openwoot-drivers = { path = "crates/openwoot-drivers" }
openwoot-gd32f3 = { path = "crates/openwoot-gd32f3" }
openwoot-gd32f4 = { path = "crates/openwoot-gd32f4" }
openwoot-host = { path = "crates/openwoot-host" }
openwoot-image = { path = "crates/openwoot-image" }
openwoot-protocol = { path = "crates/openwoot-protocol" }
postcard = { version = "=1.2.0", default-features = false }
postcard-rpc = { version = "=0.12.1", default-features = false }
postcard-schema = { version = "=0.2.6", features = ["derive"] }
predicates = "=3.1.4"
rustc-demangle = "=0.1.28"
sequential-storage = "=8.0.2"
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = "=1.0.154"
spin = { version = "=0.12.3", default-features = false, features = ["spin_mutex"] }
static_cell = "=2.1.1"
steamlocate = "=2.1.1"
svd-encoder = "=0.14.8"
svd-parser = "=0.14.10"
svd-rs = "=0.14.13"
thiserror = { version = "=2.0.21", default-features = false }
toml = { version = "=1.2.2", default-features = false, features = ["parse", "serde", "std"] }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
vcell = "=0.1.3"
wooting-60he-plus = { path = "boards/wooting-60he-plus" }
wooting-80he = { path = "boards/wooting-80he" }
x-win = "=5.8.0"
xcap = "=0.9.10"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
min_ident_chars = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "deny"
module_name_repetitions = "warn"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
pub_underscore_fields = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 2
panic = "abort"

[profile.release.package.wooting-60he-plus]
opt-level = "z"

[profile.release.package.wooting-80he]
opt-level = "z"

[profile.dev]
panic = "abort"
