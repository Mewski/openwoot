[workspace]
members = ["boards/*", "crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.100"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"
