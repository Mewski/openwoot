[workspace]
members = ["boards/*", "crates/*", "xtask"]
default-members = [
    "crates/openwoot",
    "crates/openwoot-cli",
    "crates/openwoot-drivers",
    "crates/openwoot-image",
    "crates/openwoot-protocol",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.100"

[workspace.dependencies]
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.9", features = ["derive"] }
cortex-m = "=0.7.10"
cortex-m-rt = "=0.7.7"
critical-section = "=1.2.0"
embassy-futures = "=0.1.2"
embedded-hal-async = "=1.0.0"
gd32f303-pac = { path = "crates/gd32f303-pac" }
gd32f425-pac = { path = "crates/gd32f425-pac" }
ihex = "=3.0.0"
object = { version = "=0.41.0", default-features = false, features = ["elf", "read_core", "std"] }
openwoot = { path = "crates/openwoot" }
openwoot-gd32f3 = { path = "crates/openwoot-gd32f3" }
openwoot-gd32f4 = { path = "crates/openwoot-gd32f4" }
openwoot-image = { path = "crates/openwoot-image" }
postcard = { version = "=1.2.0", default-features = false }
predicates = "=3.1.4"
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
svd-encoder = "=0.14.8"
svd-parser = "=0.14.10"
svd-rs = "=0.14.13"
thiserror = { version = "=2.0.21", default-features = false }
vcell = "=0.1.3"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
min_ident_chars = "warn"
missing_panics_doc = "allow"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
pub_underscore_fields = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"
